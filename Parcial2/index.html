<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salteneria El Horno</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Salteneria El Horno</h1>
  </header>

  <main>
    <p>Somos una salteneria de barrio que hornea salteñas frescas cada mañana. Hace tu pedido desde la pagina y te lo tenemos listo.</p>

    <form id="form-horno"  method ="POST" action="procesar.php" novalidate>
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo electronico:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="pedido">Que saltenas queres:</label>
      <textarea id="pedido" name="pedido"></textarea>

      <button type="submit">Hacer mi pedido</button>

      <p id="aviso-horno" class="aviso"></p>
    </form>
  </main>

  <footer>
    <p>Parcial 2 - Rimer Cadima Fernandez - 20 de octubre de 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
